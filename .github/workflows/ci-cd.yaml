# ════════════════════════════════════════════════════════════════
#  CI/CD PIPELINE — Phase 3 (Updated)
#  Job 1: Build & Push image automatically ✅
#  Job 2: Print deploy command (local cluster can't be reached)
#  You run the deploy command manually on your Mac ✅
# ════════════════════════════════════════════════════════════════

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: aarushgupta15/phase1-app

# ══════════════════════════════════════════════════════════════
#  JOB 1 — BUILD & PUSH DOCKER IMAGE (runs automatically)
# ══════════════════════════════════════════════════════════════
jobs:
  build-and-push:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Print image info
        run: |
          echo "✅ Image pushed: ${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # ════════════════════════════════════════════════════════════
  #  JOB 2 — PRINT DEPLOY COMMAND
  #  WHY NO AUTO-DEPLOY:
  #  kind/minikube runs on 127.0.0.1 (your Mac only)
  #  GitHub Actions is a remote server → can't reach local cluster
  #  SOLUTION: CI builds & pushes ✅ → you deploy manually on Mac ✅
  # ════════════════════════════════════════════════════════════
  notify:
    name: 📢 Ready to Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Print deploy instructions
        run: |
          echo "================================================"
          echo "✅ Image built and pushed successfully!"
          echo "📦 Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "================================================"
          echo "👇 Run these on your Mac to deploy:"
          echo "kubectl set image deployment/flask-app flask-app=${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "kubectl rollout status deployment/flask-app"
          echo "kubectl get pods"
          echo "================================================"
